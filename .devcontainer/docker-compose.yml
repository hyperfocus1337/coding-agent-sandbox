name: coding-agent-sandbox

services:
  sandbox:
    image: ghcr.io/hyperfocus1337/coding-agent-sandbox/devcontainer-agent:latest
    container_name: coding-agent-sandbox-devcontainer
    # Start as root so entrypoint.sh can seed user's sudo password from the root-only
    # mount (see docker-compose.override.yml), then it drops to user to run the command.
    # remoteUser (devcontainer.json) keeps interactive/agent shells as user.
    user: root
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: sleep infinity
    environment:
      # The GHCR image ships TZ=UTC; override at runtime so wall-clock output
      # (date, /usage reset times) reads Amsterdam local. See docs/guides/timezone.md.
      TZ: "Europe/Amsterdam"
      NODE_OPTIONS: "--max-old-space-size=4096"
      CLAUDE_CONFIG_DIR: /home/user/.claude
      WORKSPACE_FOLDER: /workspaces/coding-agent-sandbox
      # pi binds its OAuth callback server to 127.0.0.1 by default, which the
      # published ports below cannot reach: Docker forwards to eth0, so the
      # connection is refused. Binding 0.0.0.0 lets the host browser complete
      # the redirect. Undocumented upstream; added in pi-mono PR #3409.
      PI_OAUTH_CALLBACK_HOST: "0.0.0.0"
    ports:
      - "3000:3000"
      - "8080:8080"
      - "8976:8976"
      # pi OAuth callbacks. Each redirect URI is a fixed http://localhost:<port>,
      # so the host port must match exactly. Published here instead of via
      # forwardPorts in devcontainer.json, which remaps a busy host port.
      - "53692:53692" # pi: Anthropic (Claude Pro/Max)
      - "1455:1455" # pi: OpenAI Codex
    labels:
      # Opt this container in to Watchtower auto-updates.
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - ..:/workspaces/coding-agent-sandbox:cached
      - coding-agent-sandbox-claude-config:/home/user/.claude
      - coding-agent-sandbox-gitlab-duo-config:/home/user/.gitlab
      - coding-agent-sandbox-gitlab-cli-config:/home/user/.config/glab-cli
      - coding-agent-sandbox-aws-cli-config:/home/user/.aws
      - coding-agent-sandbox-azure-cli-config:/home/user/.azure
      - coding-agent-sandbox-oracle-cli-config:/home/user/.oci
      - coding-agent-sandbox-opencode-auth:/home/user/.local/share/opencode
      - coding-agent-sandbox-opencode-config:/home/user/.opencode
      - coding-agent-sandbox-cursor-state:/home/user/.cursor-server
      - coding-agent-sandbox-vscode-state:/home/user/.vscode-server
      - coding-agent-sandbox-fish-history:/home/user/.local/share/fish
      - coding-agent-sandbox-ssh-config:/home/user/.ssh
      - coding-agent-sandbox-gemini-config:/home/user/.gemini
      - coding-agent-sandbox-codex-config:/home/user/.codex
      - coding-agent-sandbox-pi-config:/home/user/.pi
      # Oh My Pi (omp) keeps config, auth, sessions, logs, and plugins under ~/.omp.
      - coding-agent-sandbox-omp-config:/home/user/.omp
      # ~/.agents/skills is the cross-agent skills dir pi reads, not pi's own config.
      - coding-agent-sandbox-agents-config:/home/user/.agents
      - coding-agent-sandbox-ccstatusline-config:/home/user/.config/ccstatusline
      # Additional workspace bind mounts (local repo paths) live in
      # docker-compose.override.yml — gitignored and merged at runtime.

  watchtower:
    # Maintained fork of the archived containrrr/watchtower
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: coding-agent-sandbox-watchtower
    restart: unless-stopped
    environment:
      # Only update containers explicitly labeled enable=true.
      WATCHTOWER_LABEL_ENABLE: "true"
      # Remove old images after pulling a newer one.
      WATCHTOWER_CLEANUP: "true"
      # Poll the registry every 6 hours (seconds).
      WATCHTOWER_POLL_INTERVAL: "21600"
      # Inline registry auth (see config/.watchtower-docker/config.json).
      DOCKER_CONFIG: /config
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../config/.watchtower-docker:/config:ro

volumes:
  coding-agent-sandbox-claude-config:
    external: true
  coding-agent-sandbox-gitlab-duo-config:
    external: true
  coding-agent-sandbox-gitlab-cli-config:
    external: true
  coding-agent-sandbox-aws-cli-config:
    external: true
  coding-agent-sandbox-azure-cli-config:
    external: true
  coding-agent-sandbox-oracle-cli-config:
    external: true
  coding-agent-sandbox-opencode-config:
    external: true
  coding-agent-sandbox-opencode-auth:
    external: true
  coding-agent-sandbox-cursor-state:
    external: true
  coding-agent-sandbox-vscode-state:
    external: true
  coding-agent-sandbox-fish-history:
    external: true
  coding-agent-sandbox-ssh-config:
    external: true
  coding-agent-sandbox-gemini-config:
    external: true
  coding-agent-sandbox-codex-config:
    external: true
  coding-agent-sandbox-pi-config:
    external: true
  coding-agent-sandbox-omp-config:
    external: true
  coding-agent-sandbox-agents-config:
    external: true
  coding-agent-sandbox-ccstatusline-config:
    external: true

networks:
  default:
    name: coding-agent-sandbox-network
