name: coding-agent-sandbox

services:
  sandbox:
    image: ghcr.io/hyperfocus1337/coding-agent-sandbox/devcontainer-agent:latest
    container_name: coding-agent-sandbox-devcontainer
    command: sleep infinity
    environment:
      NODE_OPTIONS: "--max-old-space-size=4096"
      CLAUDE_CONFIG_DIR: /home/node/.claude
      WORKSPACE_FOLDER: /workspaces/coding-agent-sandbox
    ports:
      - "3000:3000"
      - "8080:8080"
      - "8976:8976"
    labels:
      # Opt this container in to Watchtower auto-updates.
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - ..:/workspaces/coding-agent-sandbox:cached
      - coding-agent-sandbox-claude-config:/home/node/.claude
      - coding-agent-sandbox-gitlab-duo-config:/home/node/.gitlab
      - coding-agent-sandbox-gitlab-cli-config:/home/node/.config/glab-cli
      - coding-agent-sandbox-aws-cli-config:/home/node/.aws
      - coding-agent-sandbox-azure-cli-config:/home/node/.azure
      - coding-agent-sandbox-oracle-cli-config:/home/node/.oci
      - coding-agent-sandbox-opencode-auth:/home/node/.local/share/opencode
      - coding-agent-sandbox-opencode-config:/home/node/.opencode
      - coding-agent-sandbox-cursor-state:/home/node/.cursor-server
      - coding-agent-sandbox-vscode-state:/home/node/.vscode-server
      - coding-agent-sandbox-fish-history:/home/node/.local/share/fish
      - coding-agent-sandbox-ssh-config:/home/node/.ssh
      - coding-agent-sandbox-gemini-config:/home/node/.gemini
      - coding-agent-sandbox-codex-config:/home/node/.codex
      - coding-agent-sandbox-ccstatusline-config:/home/node/.config/ccstatusline
      # Additional workspace bind mounts (local repo paths) live in
      # docker-compose.override.yml — gitignored and merged at runtime.

  watchtower:
    # Maintained fork of the archived containrrr/watchtower
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: coding-agent-sandbox-watchtower
    restart: unless-stopped
    environment:
      # Only update containers explicitly labeled enable=true.
      WATCHTOWER_LABEL_ENABLE: "true"
      # Remove old images after pulling a newer one.
      WATCHTOWER_CLEANUP: "true"
      # Poll the registry every 6 hours (seconds).
      WATCHTOWER_POLL_INTERVAL: "21600"
      # Inline registry auth (see config/.watchtower-docker/config.json).
      DOCKER_CONFIG: /config
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../config/.watchtower-docker:/config:ro

volumes:
  coding-agent-sandbox-claude-config:
    external: true
  coding-agent-sandbox-gitlab-duo-config:
    external: true
  coding-agent-sandbox-gitlab-cli-config:
    external: true
  coding-agent-sandbox-aws-cli-config:
    external: true
  coding-agent-sandbox-azure-cli-config:
    external: true
  coding-agent-sandbox-oracle-cli-config:
    external: true
  coding-agent-sandbox-opencode-config:
    external: true
  coding-agent-sandbox-opencode-auth:
    external: true
  coding-agent-sandbox-cursor-state:
    external: true
  coding-agent-sandbox-vscode-state:
    external: true
  coding-agent-sandbox-fish-history:
    external: true
  coding-agent-sandbox-ssh-config:
    external: true
  coding-agent-sandbox-gemini-config:
    external: true
  coding-agent-sandbox-codex-config:
    external: true
  coding-agent-sandbox-ccstatusline-config:
    external: true

networks:
  default:
    name: coding-agent-sandbox-network
