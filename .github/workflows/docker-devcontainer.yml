name: Build devcontainer image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile
      - config/*
      - scripts/*/*
      - .github/workflows/docker-devcontainer.yml
  pull_request:
    paths:
      - Dockerfile
      - config/*
      - scripts/*/*
      - .github/workflows/docker-devcontainer.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/devcontainer
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Write the SSH config secret to a temp file so it can be passed as a BuildKit
      # secret-file. Assigned via env: to prevent the Actions runner from expanding
      # ${{ }} inline in the shell script, which can mangle multiline values.
      - name: Write SSH config secret to temp file
        env:
          SSH_CONFIG: ${{ secrets.SSH_CONFIG }}
        run: printf '%s' "$SSH_CONFIG" > /tmp/ssh_config

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GIT_DELTA_VERSION must be set as a repository variable (Settings → Variables → Actions).
          # Keep PNPM_COREPACK_VERSION and YARN_COREPACK_VERSION aligned with defaults in Justfile unless you define matching repo variables.
          build-args: |
            TZ=UTC
            GIT_DELTA_VERSION=${{ vars.GIT_DELTA_VERSION }}
            PNPM_COREPACK_VERSION=${{ vars.PNPM_COREPACK_VERSION || '11.0.9' }}
            YARN_COREPACK_VERSION=${{ vars.YARN_COREPACK_VERSION || '4.14.1' }}
          # SSH_CONFIG must be set as a repository secret (Settings → Secrets → Actions)
          secret-files: |
            ssh_config=/tmp/ssh_config
          cache-from: type=gha
          cache-to: type=gha,mode=max
