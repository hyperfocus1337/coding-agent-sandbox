name: Build devcontainer image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile
      - config/*
      - scripts/*/*
      - .github/workflows/docker-devcontainer.yml
  pull_request:
    paths:
      - Dockerfile
      - config/*
      - scripts/*/*
      - .github/workflows/docker-devcontainer.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/devcontainer
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Dockerfile uses BuildKit optional secret `ssh_config` (same as local `--secret`).
      # Write repo secret SSH_CONFIG → file; assign via env: so multiline values are not
      # mangled by ${{ }} shell expansion. Empty/unset → image still builds (no ~/.ssh/config).
      - name: Write BuildKit secret files
        env:
          SSH_CONFIG: ${{ secrets.SSH_CONFIG }}
          # Optional disposable `node` password for `sudo` in the image.
          # Create repository secret `CONTAINER_USER_PASSWORD` (Settings → Secrets → Actions), or rename here and below.
          CONTAINER_USER_PASSWORD: ${{ secrets.CONTAINER_USER_PASSWORD }}
        run: |
          printf '%s' "$SSH_CONFIG" > /tmp/ssh_config
          printf '%s' "$CONTAINER_USER_PASSWORD" > /tmp/container_user_password

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GIT_DELTA_VERSION must be set as a repository variable (Settings → Variables → Actions).
          # Keep PNPM_COREPACK_VERSION and YARN_COREPACK_VERSION aligned with defaults in Justfile unless you define matching repo variables.
          build-args: |
            TZ=UTC
            GIT_DELTA_VERSION=${{ vars.GIT_DELTA_VERSION }}
            PNPM_COREPACK_VERSION=${{ vars.PNPM_COREPACK_VERSION || '11.0.9' }}
            YARN_COREPACK_VERSION=${{ vars.YARN_COREPACK_VERSION || '4.14.1' }}
          secret-files: |
            ssh_config=/tmp/ssh_config
            container_user_password=/tmp/container_user_password
          cache-from: type=gha
          cache-to: type=gha,mode=max
