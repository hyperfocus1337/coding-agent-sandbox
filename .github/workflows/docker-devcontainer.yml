name: Build devcontainer images

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile.base
      - Dockerfile.node
      - Dockerfile.tooling
      - Dockerfile.python
      - Dockerfile.playwright
      - Dockerfile.agent
      - mise.toml
      - config/*
      - scripts/*/*
      - .github/workflows/docker-devcontainer.yml
  pull_request:
    paths:
      - Dockerfile.base
      - Dockerfile.node
      - Dockerfile.tooling
      - Dockerfile.python
      - Dockerfile.playwright
      - Dockerfile.agent
      - mise.toml
      - config/*
      - scripts/*/*
      - .github/workflows/docker-devcontainer.yml
  workflow_dispatch:

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/devcontainer-base
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Dockerfile.base uses BuildKit optional secret `ssh_config` (same as local `--secret`).
      # Write repo secret SSH_CONFIG → file; assign via env: so multiline values are not
      # mangled by ${{ }} shell expansion. Empty/unset → image still builds (no ~/.ssh/config).
      - name: Write BuildKit secret files
        env:
          SSH_CONFIG: ${{ secrets.SSH_CONFIG }}
          # Optional disposable `node` password for `sudo` in the image.
          # Create repository secret `CONTAINER_USER_PASSWORD` (Settings → Secrets → Actions), or rename here and below.
          CONTAINER_USER_PASSWORD: ${{ secrets.CONTAINER_USER_PASSWORD }}
        run: |
          printf '%s' "$SSH_CONFIG" > /tmp/ssh_config
          printf '%s' "$CONTAINER_USER_PASSWORD" > /tmp/container_user_password

      - name: Build and push base
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TZ=UTC
          secret-files: |
            ssh_config=/tmp/ssh_config
            container_user_password=/tmp/container_user_password
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

  build-node:
    needs: build-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/devcontainer-node
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # On non-PR builds the base image was pushed; pin BASE_IMAGE to its digest. On PR fall back to :latest.
      - name: Resolve node base image
        id: nodebase
        env:
          DIGEST: ${{ needs.build-base.outputs.digest }}
        run: |
          repo="ghcr.io/${{ github.repository }}/devcontainer-base"
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "$DIGEST" ]; then
            echo "base=${repo}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${repo}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push node
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.node
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ steps.nodebase.outputs.base }}
          cache-from: type=gha,scope=node
          cache-to: type=gha,mode=max,scope=node

  build-tooling:
    needs: build-node
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/devcontainer-tooling
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # On non-PR builds the node image was pushed; pin BASE_IMAGE to its digest. On PR fall back to :latest.
      - name: Resolve tooling base image
        id: toolbase
        env:
          DIGEST: ${{ needs.build-node.outputs.digest }}
        run: |
          repo="ghcr.io/${{ github.repository }}/devcontainer-node"
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "$DIGEST" ]; then
            echo "base=${repo}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${repo}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push tooling
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.tooling
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ steps.toolbase.outputs.base }}
          cache-from: type=gha,scope=tooling
          cache-to: type=gha,mode=max,scope=tooling

  build-python:
    needs: build-tooling
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/devcontainer-python
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # On non-PR builds the tooling image was pushed; pin BASE_IMAGE to its digest so the python
      # layer is bound to the exact tooling manifest produced upstream. On pull_request the tooling
      # image is not pushed, so fall back to :latest from GHCR for Dockerfile syntax validation.
      - name: Resolve python base image
        id: pybase
        env:
          DIGEST: ${{ needs.build-tooling.outputs.digest }}
        run: |
          repo="ghcr.io/${{ github.repository }}/devcontainer-tooling"
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "$DIGEST" ]; then
            echo "base=${repo}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${repo}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push python
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.python
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ steps.pybase.outputs.base }}
          cache-from: type=gha,scope=python
          cache-to: type=gha,mode=max,scope=python

  build-playwright:
    needs: build-python
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Playwright browser layer builds for both amd64 and arm64 (arm64 under QEMU) on one runner,
      # which roughly doubles disk use and overruns the ~14GB free on ubuntu-latest (ENOSPC).
      # Reclaim ~20-30GB by dropping preinstalled toolchains this image does not need.
      # Source: https://github.com/jlumbroso/free-disk-space
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/devcontainer-playwright
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # On non-PR builds pin BASE_IMAGE to the python digest from the upstream job; on PR fall back to :latest.
      - name: Resolve playwright base image
        id: pwbase
        env:
          DIGEST: ${{ needs.build-python.outputs.digest }}
        run: |
          repo="ghcr.io/${{ github.repository }}/devcontainer-python"
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "$DIGEST" ]; then
            echo "base=${repo}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${repo}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push playwright
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.playwright
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ steps.pwbase.outputs.base }}
          cache-from: type=gha,scope=playwright
          cache-to: type=gha,mode=max,scope=playwright

  build-agent:
    needs: build-playwright
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Agent builds on top of the heavy playwright image for both arches (arm64 under QEMU),
      # so reclaim disk the same way the playwright job does to avoid ENOSPC.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # config/.gitconfig is gitignored, so write it from repo variable GITCONFIG before Dockerfile.agent
      # COPYs it. Assign via env: to preserve multiline values. Empty/unset → builds with no Git identity.
      - name: Write personal gitconfig
        env:
          GITCONFIG: ${{ vars.GITCONFIG }}
        run: printf '%s' "$GITCONFIG" > config/.gitconfig

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/devcontainer-agent
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # On non-PR builds pin BASE_IMAGE to the playwright digest from the upstream job; on PR fall back to :latest.
      - name: Resolve agent base image
        id: agentbase
        env:
          DIGEST: ${{ needs.build-playwright.outputs.digest }}
        run: |
          repo="ghcr.io/${{ github.repository }}/devcontainer-playwright"
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "$DIGEST" ]; then
            echo "base=${repo}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${repo}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ steps.agentbase.outputs.base }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
