name: Build devcontainer image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - Dockerfile
      - config/*
      - scripts/*/*
      - .github/workflows/docker-devcontainer.yml
  pull_request:
    paths:
      - Dockerfile
      - config/*
      - scripts/*/*
      - .github/workflows/docker-devcontainer.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/devcontainer
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GIT_DELTA_VERSION must be set as a repository variable (Settings → Variables → Actions)
          # SSH_CONFIG must be set as a repository secret (Settings → Secrets → Actions)
          build-args: |
            TZ=UTC
            GIT_DELTA_VERSION=${{ vars.GIT_DELTA_VERSION }}
          secrets: |
            ssh_config=${{ secrets.SSH_CONFIG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
